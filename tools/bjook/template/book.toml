# One book. Everything about the page lives here; `bjook build` reads it.

title  = "Untitled"
author = ""
arena  = ""          # are.na channel slug that `bjook fetch` pulls from

[page]
width   = "5.5in"    # half letter: folds from a letter sheet
height  = "8.5in"
top     = "1.0in"
bottom  = "1.5in"   # the folio sits in this margin
inside  = "1.25in"  # the fold side
outside = "1.0in"

[type]
text    = "Gentium"  # a family name as the font itself spells it
display = ""         # titles; empty = same as text
title   = ""         # the title page; empty = same as display
size    = "10pt"
leading = "15pt"     # keep (height - top - bottom) a whole number of these
fonts_dir = "~/Code/libreFontLibrary/Families"

# The page number, the running head and the continues mark are each a line
# of text in the top or bottom margin, and take the same settings:
#   font      a family name; empty = same as text
#   size, weight
#   position  top or bottom, then outside, inside or center
#   from_edge distance from the paper's edge, e.g. "1in"
#   drop      or: gap from the text block; empty = one line
#   css       extra CSS, e.g. "text-transform: uppercase; letter-spacing: 0.08em;"
# No two of them can share a position.

[folio]                 # the page number
font      = ""
size      = "9pt"
weight    = "normal"
position  = "bottom-outside"
from_edge = ""
drop      = ""

[head]                  # the running head; leave verso and recto empty for none
verso     = ""          # left-hand pages. {title}, {author} and {poem} fill in
recto     = ""          # right-hand pages
font      = ""
size      = "8pt"
position  = "top-center"
from_edge = ""

[continues]             # a mark at the foot of a page where a poem runs on
text      = ""          # e.g. "→"; empty = no mark
font      = ""          # check the font draws the mark you expect
size      = "7pt"
position  = "bottom-inside"

[book]
contents     = true
smart_quotes = true  # typographer's quotes, apostrophes, ellipses and spaced
                     # em dashes at build; poem files stay as typed
ink          = "#000"  # text prints as solid black, not a brown mix
colophon     = ""
closing      = ""    # a line set like the title, on the last page
end_mark     = ""    # a sign under each poem's last line, e.g. "‡"
